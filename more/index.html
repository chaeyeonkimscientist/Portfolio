    let selected = DATA.projects[0]?.name || "";
    DATA.projects = DATA.projects.filter(p => DATA.star[p.name]);
    let activeFilter = "all";
    let activeTag = null;
    let activeKeywords = [];

    const $ = (id) => document.getElementById(id);

    function categoryClass(category) {
      if (!category) return "";
      if (category.toLowerCase().includes("music")) return "music";
      if (category.toLowerCase().includes("cognition")) return "cognition";
      if (category.toLowerCase().includes("technology")) return "technology";
      return "";
    }

    function slugify(s) {
      return s.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
    }

    function projectByName(name) {
      return DATA.projects.find(p => p.name === name);
    }

    function starByName(name) {
      return DATA.star[name] || {};
    }

    function parseLinks(raw) {
      if (!raw) return [];
      const lines = String(raw).split(/\r?\n/).map(s => s.trim()).filter(Boolean);
      const links = [];
      for (const line of lines) {
        const urls = line.match(/https?:\/\/[^\s<]+|(?:\.\.\/|\.\/)[^\s<]+/g) || [];
        if (!urls.length && /^[./].+\.html?(?:\?.*)?$/i.test(line)) urls.push(line);
        urls.forEach((url, i) => {
          const clean = url.replace(/[)\],.;]+$/, "");
          let label = line.replace(url, "").trim();
          label = label.replace(/[:\-–—]\s*$/, "").trim();
          if (!label) label = urls.length > 1 ? `Link ${i + 1}` : "Open project";
          links.push({label, url: clean});
        });
      }
      return links;
    }

    function renderSelected() {
      const p = projectByName(selected);
      if (!p) return;
      const s = starByName(selected);
      const idx = DATA.projects.findIndex(x => x.name === selected) + 1;

      $("projectTitle").textContent = p.name.toUpperCase();
      $("projectIndex").textContent = String(idx).padStart(2, "0");
      $("situation").textContent = s.situation || "—";
      $("task").textContent = s.task || "—";
      $("action").textContent = s.action || "—";
      $("result").textContent = s.result || "—";

      const tags = p.keywords.slice(0, 5);
      $("projectTags").innerHTML = tags.map(t => `<span class="tag ${tagCategory(t)}">${escapeHtml(t)}</span>`).join("");

      const links = parseLinks(p.links);
      $("projectLinks").innerHTML = links.length
        ? links.map((l, i) => `<a class="link-card" href="${escapeAttr(l.url)}" target="_blank" rel="noopener"><span>${escapeHtml(l.label)}</span><b>${i === 0 ? "↗" : "↗"}</b></a>`).join("")
        : `<span class="link-empty">No external artifact linked yet.</span>`;

      document.title = `${p.name} — Chaeyeon Kim`;
      const wave = document.querySelector(".waveform");
      if (wave) {
        wave.classList.remove("playing");
        void wave.offsetWidth;
        wave.classList.add("playing");
      }
    }

    function tagCategory(tag) {
      const all = [...DATA.collections, ...DATA.keywords];
      const item = all.find(x => x.name === tag);
      return item ? categoryClass(item.category) : "";
    }

    function renderCollections() {
      const shown = DATA.collections;
      $("collectionList").innerHTML = shown.map((c, i) => `
        <button class="collection-card ${categoryClass(c.category)}" data-collection="${escapeAttr(c.name)}">
          <div class="collection-art art-${i}"><span>${i === 0 ? "∿" : "◌"}</span></div>
          <div class="collection-copy">
            <div class="collection-name">${escapeHtml(c.name)}</div>
            <div class="collection-meta">${c.count} projects · ${escapeHtml(c.description)}</div>
          </div>
          <span class="round-arrow">→</span>
        </button>
      `).join("");

      document.querySelectorAll("[data-collection]").forEach(btn => {
        btn.addEventListener("click", () => {
          activeFilter = "collection";
          activeTag = btn.dataset.collection;
          activeKeywords = [];
          renderArtifacts();
          requestAnimationFrame(() => {
            $("artifact-panel")?.scrollIntoView({behavior:"smooth", block:"start"});
          });
        });
      });
    }

    
    function renderKeywordCloud() {
      if (!$('keywordCloud')) return;
      const ordered = [...DATA.keywords].sort((a, b) => {
        const order = {technology: 0, cognition: 1, music: 2};
        return (order[categoryClass(a.category)] ?? 9) - (order[categoryClass(b.category)] ?? 9) || a.name.localeCompare(b.name);
      });
      $('keywordCloud').innerHTML = ordered.map(k =>
        `<button class="keyword-chip ${activeKeywords.includes(k.name) ? "active" : ""} ${categoryClass(k.category)}" data-keyword="${escapeAttr(k.name)}">${escapeHtml(k.name)}</button>`
      ).join('');
      document.querySelectorAll('[data-keyword]').forEach(btn => btn.addEventListener('click', () => {
        const key = btn.dataset.keyword;
        if (activeKeywords.includes(key)) {
          activeKeywords = activeKeywords.filter(k => k !== key);
        } else {
          activeKeywords = [...activeKeywords, key];
        }
        activeFilter = activeKeywords.length ? 'keyword' : 'all';
        activeTag = null;
        document.querySelectorAll('.filter').forEach(x => x.classList.remove('active'));
        document.querySelector('[data-filter="all"]').classList.add('active');
        renderKeywordCloud();
        renderArtifacts();
      }));
    }

    function renderArtifacts() {
      renderKeywordCloud();
      let visible = DATA.projects.slice();

      if (activeFilter === 'collection' && activeTag) {
        const c = DATA.collections.find(x => x.name === activeTag);
        visible = c ? visible.filter(p => p.collections.includes(c.name)) : [];
      } else if (activeKeywords.length) {
        visible = visible.filter(p => activeKeywords.every(k => p.keywords.includes(k)));
      }

      let filterLabel = '';
      if (activeFilter === 'collection' && activeTag) filterLabel = `Playlist: ${activeTag}`;
      else if (activeKeywords.length) filterLabel = `Keywords: ${activeKeywords.join(' + ')}`;
      $('activeFilters').innerHTML = filterLabel
        ? `<span class="filter-note">${escapeHtml(filterLabel)} <button id="clearFilter">×</button></span>`
        : '';

      $('artifactList').innerHTML = visible.map((p) => {
        const isSelected = p.name === selected;
        return `
          <article class="artifact ${isSelected ? 'selected' : ''}" data-project="${escapeAttr(p.name)}">
            <button class="artifact-main">
              <span class="artifact-marker">${isSelected ? '−' : '+'}</span>
              <span class="artifact-copy"><strong>${escapeHtml(p.name)}</strong></span>
              <span class="artifact-tags">
                ${p.keywords.map(k => `<span class="tag ${tagCategory(k)}">${escapeHtml(k)}</span>`).join('')}
              </span>
              <span class="artifact-chevron">${isSelected ? '⌃' : '⌄'}</span>
            </button>
          </article>
        `;
      }).join('');

      document.querySelectorAll('[data-project]').forEach(card => {
        card.addEventListener('click', (e) => {
          if (e.target.closest('a')) return;
          selectProject(card.dataset.project);
        });
      });
      $('clearFilter')?.addEventListener('click', clearFilter);
    }

    function selectProject(name, rerender = true) {
      selected = name;
      renderSelected();
      if (rerender) renderArtifacts();
      document.querySelector(".deep-dive")?.scrollIntoView({behavior:"smooth", block:"start"});
    }

    function clearFilter() {
      activeFilter = "all";
      activeTag = null;
      activeKeywords = [];
      renderKeywordCloud();
      document.querySelectorAll(".filter").forEach(x => x.classList.remove("active"));
      document.querySelector('[data-filter="all"]').classList.add("active");
      renderArtifacts();
    }

    document.querySelectorAll(".filter").forEach(btn => {
      btn.addEventListener("click", () => {
        activeFilter = btn.dataset.filter;
        activeTag = null;
        activeKeywords = [];
        renderKeywordCloud();
        document.querySelectorAll(".filter").forEach(x => x.classList.remove("active"));
        btn.classList.add("active");
        renderArtifacts();
      });
    });

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
    }
    function escapeAttr(s) { return escapeHtml(s); }

    renderCollections();
    renderSelected();
    renderKeywordCloud();
    renderArtifacts();
  </script>
</body>
